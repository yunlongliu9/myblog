events {}

http {
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/news(?:/|$) {
            set $news_backend morgenbrief:3000;
            proxy_pass http://$news_backend;
        }

        location = /services/franken-job-radar {
            absolute_redirect off;
            return 308 /services/franken-job-radar/;
        }

        location ^~ /services/franken-job-radar/ {
            set $radar_backend franken-job-radar:3000;
            rewrite ^/services/franken-job-radar(/.*)$ $1 break;
            proxy_pass http://$radar_backend;
        }

        location = /service/food {
            absolute_redirect off;
            return 308 /service/food/;
        }

        location ~ ^/service/food/(?<food_asset>index\.html|style\.css|app\.js|offers\.json)?$ {
            set $food_backend yunlongliu9.github.io;
            proxy_pass_request_headers off;
            proxy_set_header Host $food_backend;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass https://$food_backend/coupon-necessarities/$food_asset;
        }

        location / {
            set $web_backend web:3000;
            proxy_pass http://$web_backend;
        }
    }
}
