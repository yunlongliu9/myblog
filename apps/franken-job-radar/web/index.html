<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franken Job Radar · 弗兰肯求职雷达</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./app.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a href="./" class="brand"><span class="mark" aria-hidden="true">◎</span> Franken <strong>Job Radar</strong></a><a class="service-back" href="/services">返回 Services</a></div></header>
<main class="wrap">
  <section class="hero">
    <p class="eyebrow">OBERFRANKEN / MITTELFRANKEN / UNTERFRANKEN</p>
    <h1>弗兰肯<span>求职雷达</span></h1>
    <p>从纽伦堡出发，查找整个弗兰肯的 IT 与数字化岗位，直接前往雇主官网申请。</p>
  </section>
  <section class="filters" aria-labelledby="search-heading">
    <h2 id="search-heading">岗位筛选</h2>
    <fieldset><legend>专业方向 <small>可多选</small></legend>
    <div class="directions">
      <label><input type="checkbox" name="direction" value="cloud" checked><span>云计算与分布式计算<small>Cloud &amp; Distributed Systems</small></span></label>
      <label><input type="checkbox" name="direction" value="software" checked><span>软件开发<small>Software Engineering</small></span></label>
      <label><input type="checkbox" name="direction" value="security" checked><span>IT 安全与治理<small>IT Security &amp; Governance</small></span></label>
      <label><input type="checkbox" name="direction" value="bpm" checked><span>BPM 与传统行业数字化<small>BPM &amp; Digital Transformation</small></span></label>
      <label><input type="checkbox" name="direction" value="agent" checked><span>AI Agent 应用开发<small>AI Agent Development</small></span></label>
      <label><input type="checkbox" name="direction" value="cloud-security" checked><span>云安全与云治理<small>Cloud Security &amp; Governance</small></span></label>
    </div></fieldset>
    <fieldset><legend>岗位类型</legend>
      <div class="types">
        <label><input type="radio" name="kind" value="student" checked><span>在读岗位<small>Werkstudent · Praktikum · Internship</small></span></label>
        <label><input type="radio" name="kind" value="regular"><span>毕业后正式岗位<small>Junior 及普通岗位</small></span></label>
      </div>
    </fieldset>
    <div class="actions"><div><button class="locate" id="locate" type="button">使用我的位置</button><p id="location" class="note" aria-live="polite">按距纽伦堡市中心的直线距离排序</p></div><button class="start" id="start" type="button">开始搜索</button></div>
  </section>
  <section class="results" aria-labelledby="result-heading">
    <div class="result-header"><h2 id="result-heading">搜索结果</h2></div>
    <div class="result-views" role="group" aria-label="切换结果视图">
      <button type="button" id="show-jobs" aria-pressed="true" aria-controls="job-view">匹配岗位</button>
      <button type="button" id="show-incomplete" aria-pressed="false" aria-controls="incomplete-view">未完整读取</button>
    </div>
    <p id="status" class="note" role="status">点击开始搜索即可重新访问企业招聘网站。每周日也会自动复查。</p>
    <progress id="progress" hidden></progress>
    <div id="job-view">
      <p id="count"></p>
      <div id="jobs"></div>
    </div>
    <div id="incomplete-view" hidden>
      <div class="coverage-toolbar">
        <p id="coverage-summary" class="note"></p>
        <select id="coverage-filter" aria-label="按读取状态筛选">
          <option value="all">全部状态</option>
          <option value="partial">部分读取</option>
          <option value="failed">未能读取</option>
        </select>
      </div>
      <p id="coverage-empty" class="note"></p>
      <div id="sources"></div>
    </div>
  </section>
  <details id="directory" class="results">
    <summary>按城市查看企业招聘目录</summary>
    <p id="directory-status" class="note" role="status"></p>
    <div id="directory-cities"></div>
  </details>
</main>
<footer class="wrap">FRANKEN JOB RADAR</footer>
</body>
</html>
