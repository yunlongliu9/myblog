services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  morgenbrief:
    build:
      context: ./apps/morgenbrief
    restart: unless-stopped

  franken-job-radar:
    build:
      context: ./apps/franken-job-radar
    restart: unless-stopped
    volumes:
      - franken-job-radar-data:/app/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - morgenbrief
      - franken-job-radar

volumes:
  franken-job-radar-data:
